name: Streamly CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  typecheck:
    name: Typecheck & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Server Typecheck
        run: npm run typecheck
        working-directory: server

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Client Typecheck & Production Build
        run: |
          npm run typecheck
          npm run build
        working-directory: client

  server-tests:
    name: Server Integration & Jest Test Suite
    runs-on: ubuntu-latest
    needs: typecheck

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Run Jest Test Suite
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/netflix_clone_test
          JWT_SECRET: super_secret_jwt_access_key_change_in_production_32chars_min
          JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_change_in_production_32chars
        run: npm test
        working-directory: server

  client-tests:
    name: Client Component Test Suite (Vitest)
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Run Vitest Suite
        run: npm test
        working-directory: client

  stress-test:
    name: API Stress & Concurrency Load Benchmark
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Seed Database
        env:
          MONGODB_URI: mongodb://localhost:27017/netflix_clone_test
          JWT_SECRET: super_secret_jwt_access_key_change_in_production_32chars_min
          JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_change_in_production_32chars
        run: npm run seed
        working-directory: server

      - name: Execute API Stress Benchmark
        env:
          MONGODB_URI: mongodb://localhost:27017/netflix_clone_test
          JWT_SECRET: super_secret_jwt_access_key_change_in_production_32chars_min
          JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_change_in_production_32chars
        run: npm run test:stress
        working-directory: server
